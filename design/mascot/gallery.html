<!doctype html>
<html lang="zh"><head><meta charset="utf-8"><title>ClipClop 吉祥物方案对比</title>
<style>
:root{color-scheme:light dark;--bg:#f2f3f4;--card:#fafbfb;--line:#d9dde0;--ink:#1c1e20;--ink2:#5d6367}
@media(prefers-color-scheme:dark){:root{--bg:#17181a;--card:#1e2022;--line:#2c2f32;--ink:#ecedee;--ink2:#aeb3b7}}
body{margin:0;padding:40px;background:var(--bg);color:var(--ink);font:15px/1.6 -apple-system,system-ui,sans-serif}
h1{margin:0 0 6px;font-size:28px}p.lead{margin:0 0 32px;color:var(--ink2)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:20px}
figure{margin:0;padding:20px;border:1px solid var(--line);border-radius:14px;background:var(--card)}
figure .art{aspect-ratio:1;display:grid;place-items:center}
figure .art>*{width:100%;height:100%;object-fit:contain}
figcaption{margin-top:12px}figcaption b{display:block}figcaption span{color:var(--ink2);font-size:13px}
.sizes{display:flex;align-items:end;gap:14px;margin-top:10px}.sizes>*{flex:none}
.missing{color:var(--ink2);font-size:13px}
/* shared mascot shapes, three skins */
.m .eye{transform-box:fill-box;transform-origin:center}
.clay .cream{fill:url(#g-cream)}.clay .black{fill:url(#g-black)}.clay .orange{fill:url(#g-orange)}.clay .tan{fill:url(#g-tan)}
.clay .brown{fill:url(#g-brown)}.clay .horn{fill:url(#g-horn)}.clay .pink{fill:#e7b489}.clay .ear-in-h{fill:#a4502e}
.clay .nostril{fill:#b0612a}.clay .pupil{fill:url(#g-eye)}.clay .glint{fill:#fff}.clay .body{filter:url(#soft)}
.flat .cream{fill:#f5ead6}.flat .black{fill:#3b3b3e}.flat .orange{fill:#efa33b}.flat .tan{fill:#f7c872}.flat .brown{fill:#8a472b}
.flat .horn{fill:#f1d18a}.flat .pink{fill:#e6b287}.flat .ear-in-h{fill:#a4502e}.flat .nostril{fill:#b8672b}.flat .pupil{fill:#1d1d1f}.flat .glint{fill:#fff}
.line *{fill:var(--card);stroke:var(--ink);stroke-width:9;stroke-linejoin:round}
.line .black,.line .nostril,.line .pupil{fill:var(--ink)}.line .glint{fill:var(--card);stroke:none}.line .pink,.line .ear-in-h{stroke-width:7}
</style></head><body>
<h1>ClipClop 吉祥物方案对比</h1>
<p class="lead">左上三个 SVG 方案可以交互：眼睛跟随鼠标（弹簧惯性），随机眨眼，点击会点头。每张卡片下面的小图是 32px / 64px 预览，用来判断当作 app 图标时是否还能看清。</p>
<svg width="0" height="0" style="position:absolute"><defs>
<radialGradient id="g-cream" cx=".35" cy=".3" r=".85"><stop offset="0" stop-color="#fffaf0"/><stop offset=".55" stop-color="#f4e8d2"/><stop offset="1" stop-color="#dcc8a6"/></radialGradient>
<radialGradient id="g-black" cx=".35" cy=".3" r=".85"><stop offset="0" stop-color="#5b5b5f"/><stop offset=".6" stop-color="#3a3a3d"/><stop offset="1" stop-color="#28282a"/></radialGradient>
<radialGradient id="g-orange" cx=".35" cy=".28" r=".85"><stop offset="0" stop-color="#ffc766"/><stop offset=".55" stop-color="#efa23a"/><stop offset="1" stop-color="#d9832a"/></radialGradient>
<radialGradient id="g-tan" cx=".4" cy=".3" r=".8"><stop offset="0" stop-color="#ffdc94"/><stop offset=".6" stop-color="#f6c46a"/><stop offset="1" stop-color="#e3a44d"/></radialGradient>
<radialGradient id="g-brown" cx=".35" cy=".3" r=".85"><stop offset="0" stop-color="#b0613b"/><stop offset=".6" stop-color="#8a472b"/><stop offset="1" stop-color="#6b3320"/></radialGradient>
<radialGradient id="g-horn" cx=".35" cy=".3" r=".85"><stop offset="0" stop-color="#fff0c4"/><stop offset="1" stop-color="#e3c077"/></radialGradient>
<radialGradient id="g-eye" cx=".35" cy=".3" r=".8"><stop offset="0" stop-color="#3a3a3e"/><stop offset="1" stop-color="#0c0c0d"/></radialGradient>
<filter id="soft" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity=".18"/></filter>
<clipPath id="cow-clip"><path d="M205 222C300 222 360 300 358 400C356 490 300 548 210 548C115 548 62 480 66 390C70 295 120 222 205 222Z"/></clipPath>
<clipPath id="horse-clip"><path d="M480 200C570 200 625 280 622 380C620 470 580 545 480 552C390 555 345 490 350 395C355 290 395 200 480 200Z"/></clipPath>
</defs></svg>
<template id="mascot"><svg class="m" viewBox="0 0 680 680" role="img" aria-label="ClipClop cow and horse">
<g class="body">
 <g class="horse-head">
  <ellipse class="brown" cx="632" cy="268" rx="24" ry="44" transform="rotate(-25 632 268)"/><ellipse class="brown" cx="648" cy="335" rx="24" ry="46" transform="rotate(-12 648 335)"/><ellipse class="brown" cx="640" cy="405" rx="22" ry="46" transform="rotate(8 640 405)"/><ellipse class="brown" cx="612" cy="462" rx="20" ry="42" transform="rotate(22 612 462)"/>
  <path class="orange" d="M570 225C575 170 600 130 625 132C646 146 640 205 620 245Z"/><path class="ear-in-h" d="M584 222C588 184 604 154 620 152C632 164 626 202 612 232Z"/>
  <path class="orange" d="M400 215C385 160 405 105 430 98C455 105 470 160 462 215Z"/><path class="ear-in-h" d="M414 205C406 166 418 128 432 122C446 130 452 170 447 205Z"/>
  <path class="orange" d="M480 200C570 200 625 280 622 380C620 470 580 545 480 552C390 555 345 490 350 395C355 290 395 200 480 200Z"/>
  <path class="cream" clip-path="url(#horse-clip)" d="M452 238C472 226 506 230 516 248C521 300 507 360 502 430L428 430C440 360 440 292 452 238Z"/>
  <ellipse class="tan" cx="452" cy="476" rx="102" ry="78"/>
  <ellipse class="nostril" cx="403" cy="463" rx="12" ry="14"/><ellipse class="nostril" cx="498" cy="478" rx="12" ry="14"/>
  <ellipse class="brown" cx="562" cy="190" rx="30" ry="56" transform="rotate(40 562 185)"/><ellipse class="brown" cx="506" cy="196" rx="32" ry="66" transform="rotate(48 506 196)"/><ellipse class="brown" cx="452" cy="215" rx="30" ry="66" transform="rotate(40 448 222)"/>
  <g class="eye" data-x="415" data-y="346"><ellipse class="pupil" cx="415" cy="346" rx="22" ry="27"/><ellipse class="glint" cx="408" cy="336" rx="7" ry="8"/></g>
  <g class="eye" data-x="545" data-y="365"><ellipse class="pupil" cx="545" cy="365" rx="22" ry="27"/><ellipse class="glint" cx="538" cy="355" rx="7" ry="8"/></g>
 </g>
 <g class="cow-head">
  <g transform="rotate(-14 62 322)"><ellipse class="cream" cx="62" cy="322" rx="58" ry="36"/><ellipse class="pink" cx="66" cy="324" rx="38" ry="20"/></g>
  <g transform="rotate(-22 334 262)"><ellipse class="cream" cx="334" cy="262" rx="46" ry="31"/><ellipse class="pink" cx="330" cy="264" rx="29" ry="17"/></g>
  <path class="horn" d="M92 262C78 238 88 212 108 210C125 212 130 240 120 262Z"/><path class="horn" d="M250 232C245 205 255 182 272 182C290 185 292 212 282 236Z"/>
  <path class="cream" d="M205 222C300 222 360 300 358 400C356 490 300 548 210 548C115 548 62 480 66 390C70 295 120 222 205 222Z"/>
  <path class="black" clip-path="url(#cow-clip)" d="M60 320C84 288 158 282 190 318C216 350 206 420 176 442C140 462 92 452 60 424Z"/>
  <path class="black" d="M140 245C150 205 215 195 250 215C275 230 272 262 245 268C225 272 222 250 205 252C185 255 170 275 150 268C138 262 136 255 140 245Z"/>
  <ellipse class="tan" cx="238" cy="472" rx="118" ry="76"/>
  <ellipse class="nostril" cx="188" cy="487" rx="13" ry="14"/><ellipse class="nostril" cx="290" cy="470" rx="13" ry="14"/>
  <g class="eye" data-x="148" data-y="378"><ellipse class="pupil" cx="148" cy="378" rx="24" ry="28"/><ellipse class="glint" cx="140" cy="367" rx="7.5" ry="8.5"/></g>
  <g class="eye" data-x="280" data-y="360"><ellipse class="pupil" cx="280" cy="360" rx="22" ry="27"/><ellipse class="glint" cx="273" cy="350" rx="7" ry="8"/></g>
 </g>
</g></svg></template>
<div class="grid" id="grid"></div>
<script>
const cards = [
  ["hybrid", "", "D · 高清底图 + SVG 眼睛（推荐）", "Codex 去眼高清图做底，4 只眼睛由 SVG 绘制并可动：保留原有黏土质感，又能眨眼、看向鼠标"],
  ["svg", "clay", "A · SVG 黏土渐变（我手绘）", "复刻现有造型，矢量无限清晰，眼睛独立可动；质感比原图平一些"],
  ["svg", "flat", "B · SVG 扁平", "同一套形状，纯色无渐变，小尺寸最清楚，体积最小"],
  ["svg", "line", "C · SVG 线稿 / 单色", "适合菜单栏托盘图标、Logo 组合，跟随深浅色主题"],
  ["img", "source.png", "现有位图（680px）", "当前官网使用的版本"],
  ["img", "mascot-hd.png", "Codex · 高清重绘", "目标 2048px，同构图提升细节"],
  ["img", "mascot-noeyes.png", "Codex · 去眼版", "给眼睛动画用的底图"],
  ["img", "styles/style-flat.png", "Codex · 扁平插画", ""],
  ["img", "styles/style-emboss.png", "Codex · Big Sur 式柔和 3D", ""],
  ["img", "styles/style-mono.png", "Codex · 单色字形", ""],
  ["img", "styles/style-pixel.png", "Codex · 像素风", ""],
];
const tpl = document.getElementById("mascot").innerHTML;
const hybrid = (size = "") => `<div class="hybrid" style="position:relative;${size ? `width:${size}px;height:${size}px` : "width:100%;height:100%"}"><img src="mascot-noeyes.png" alt="" style="position:absolute;inset:0;width:100%;height:100%"><svg class="m clay" viewBox="0 0 680 680" style="position:absolute;inset:0;width:100%;height:100%">'<g class="eye"><ellipse class="pupil" cx="146" cy="376" rx="22" ry="28"/><ellipse class="glint" cx="138" cy="365" rx="7" ry="8"/></g><g class="eye"><ellipse class="pupil" cx="279" cy="359.5" rx="22" ry="28"/><ellipse class="glint" cx="271" cy="349" rx="7" ry="8"/></g><g class="eye"><ellipse class="pupil" cx="414" cy="346" rx="21.5" ry="27.5"/><ellipse class="glint" cx="406" cy="335" rx="7" ry="8"/></g><g class="eye"><ellipse class="pupil" cx="545" cy="368" rx="22.5" ry="28.5"/><ellipse class="glint" cx="537" cy="357" rx="7" ry="8"/></g>'</svg></div>`;
const grid = document.getElementById("grid");
for (const [kind, src, title, note] of cards) {
  const fig = document.createElement("figure");
  const art = kind === "hybrid" ? hybrid() : kind === "svg" ? tpl.replace('class="m"', `class="m ${src}"`) : `<img src="${src}" alt="${title}" onerror="this.outerHTML='<span class=missing>还没生成</span>'">`;
  const small = kind === "hybrid" ? hybrid(32) + hybrid(64) : kind === "svg" ? tpl.replace('class="m"', `class="m ${src}" width="32" height="32"`) + tpl.replace('class="m"', `class="m ${src}" width="64" height="64"`)
    : `<img src="${src}" width="32" height="32" onerror="this.remove()"><img src="${src}" width="64" height="64" onerror="this.remove()">`;
  fig.innerHTML = `<div class="art">${art}</div><figcaption><b>${title}</b><span>${note}</span><div class="sizes">${small}</div></figcaption>`;
  grid.append(fig);
}
// Grok-style eyes: critically damped spring toward the cursor, random blinks, nod on click.
const heroes = [...document.querySelectorAll(".art > svg.m, .art > .hybrid > svg.m")];
const state = heroes.map((svg) => ({ svg, x: 0, y: 0, vx: 0, vy: 0, eyes: [...svg.querySelectorAll(".eye")], blinkAt: performance.now() + 1500 + Math.random() * 2500 }));
let pointer = null;
addEventListener("pointermove", (e) => pointer = { x: e.clientX, y: e.clientY });
const w = 14, z = 1;
let last = performance.now();
function frame(now) {
  const dt = Math.min(.05, (now - last) / 1000); last = now;
  for (const s of state) {
    const r = s.svg.getBoundingClientRect();
    let tx = 0, ty = 0;
    if (pointer) {
      const dx = pointer.x - (r.left + r.width / 2), dy = pointer.y - (r.top + r.height / 2), d = Math.hypot(dx, dy) || 1, k = Math.min(1, d / 300);
      tx = dx / d * 9 * k; ty = dy / d * 9 * k;
    }
    for (let i = 0; i < 4; i++) { const h = dt / 4;
      s.vx += (-2 * z * w * s.vx - w * w * (s.x - tx)) * h; s.x += s.vx * h;
      s.vy += (-2 * z * w * s.vy - w * w * (s.y - ty)) * h; s.y += s.vy * h; }
    let blink = 1;
    const t = now - s.blinkAt;
    if (t > 0) { blink = t < 160 ? Math.abs(1 - t / 80) * .9 + .1 : 1; if (t >= 160) s.blinkAt = now + 2200 + Math.random() * 3200; }
    for (const eye of s.eyes) eye.style.transform = `translate(${s.x.toFixed(2)}px, ${s.y.toFixed(2)}px) scaleY(${blink})`;
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
for (const s of state) (s.svg.closest(".hybrid") || s.svg).addEventListener("click", () => (s.svg.closest(".hybrid") || s.svg.querySelector(".body")).animate(
  [{ transform: "rotate(0)" }, { transform: "rotate(-4deg) translateY(6px)" }, { transform: "rotate(2deg)" }, { transform: "rotate(0)" }],
  { duration: 520, easing: "cubic-bezier(.16,1,.3,1)", transformOrigin: "340px 560px" }));
document.querySelectorAll(".body").forEach((b) => b.style.transformOrigin = "340px 560px");
document.querySelectorAll(".art > .hybrid").forEach((b) => b.style.transformOrigin = "50% 82%");
</script>
</body></html>
