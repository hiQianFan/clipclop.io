name = "clipclop-io"
main = "worker.js"
compatibility_date = "2026-09-04"
workers_dev = false
preview_urls = false

[assets]
directory = "./dist"
binding = "ASSETS"
html_handling = "drop-trailing-slash"
run_worker_first = ["/", "/download", "/download/*", "/changelog", "/privacy", "/latest.json", "/releases/*"]

[[r2_buckets]]
binding = "RELEASES"
bucket_name = "clipclop-releases"

[[routes]]
pattern = "clipclop.io"
custom_domain = true
